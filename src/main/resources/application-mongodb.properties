# -------------------------------------------------------
# MongoDB Profile
# Activate with: mvn spring-boot:run -Dspring-boot.run.profiles=mongodb
# Or: java -jar app.jar --spring.profiles.active=mongodb
# Or env: SPRING_PROFILES_ACTIVE=mongodb
# -------------------------------------------------------

# MongoDB Connection (used by MongoConfig)
mongodb.uri=mongodb://localhost:27017
mongodb.database=hotelsdb

# Disable JPA, DataSource, and Liquibase (not applicable to MongoDB)
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration,org.springframework.boot.autoconfigure.liquibase.LiquibaseAutoConfiguration

# H2 Console - not needed for MongoDB
spring.h2.console.enabled=false
