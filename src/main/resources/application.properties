spring.application.name=hotels

# -------------------------------------------------------
# Active profile: h2 (default), mysql, postgresql, mongodb
# Switch by setting: -Dspring.profiles.active=<profile>
# Or via environment variable: SPRING_PROFILES_ACTIVE=<profile>
# -------------------------------------------------------

server.port=8092
server.servlet.context-path=/property-view

# JPA (shared for all relational DB profiles)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

# H2 Console (only relevant for H2 profile)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Liquibase (shared for all relational DB profiles)
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml

# -------------------------------------------------------
# H2 (default profile - no extra config needed)
# -------------------------------------------------------
spring.datasource.url=jdbc:h2:mem:hotelsdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
