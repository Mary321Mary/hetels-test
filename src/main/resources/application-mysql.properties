# -------------------------------------------------------
# MySQL Profile
# Activate with: mvn spring-boot:run -Dspring-boot.run.profiles=mysql
# Or: java -jar app.jar --spring.profiles.active=mysql
# Or env: SPRING_PROFILES_ACTIVE=mysql
# -------------------------------------------------------

# MySQL DataSource
spring.datasource.url=jdbc:mysql://localhost:3306/hotelsdb?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=root

# H2 Console - not needed for MySQL
spring.h2.console.enabled=false
