# -------------------------------------------------------
# PostgreSQL Profile
# Activate with: mvn spring-boot:run -Dspring-boot.run.profiles=postgresql
# Or: java -jar app.jar --spring.profiles.active=postgresql
# Or env: SPRING_PROFILES_ACTIVE=postgresql
# -------------------------------------------------------

# PostgreSQL DataSource
spring.datasource.url=jdbc:postgresql://localhost:5432/hotelsdb
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=postgres
spring.datasource.password=postgres

# H2 Console - not needed for PostgreSQL
spring.h2.console.enabled=false
